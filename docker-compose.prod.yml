services:
  bagstack:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bagstack_app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SMTP_USER=${SMTP_USER:-adityaraj212.work@gmail.com}
      - SMTP_PASS=${SMTP_PASS:-}
      - DATABASE_PATH=/app/data/finance.db
    volumes:
      - bagstack_data:/app/data
    networks:
      - bagstack_net

  caddy:
    image: caddy:2-alpine
    container_name: bagstack_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - bagstack
    networks:
      - bagstack_net

volumes:
  bagstack_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  bagstack_net:
    driver: bridge
